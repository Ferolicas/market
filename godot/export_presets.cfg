[preset.0]
name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.js,*.txt"
exclude_filter="tests/*,integration/*,tools/*,web/*"
export_path="../.migration-validation/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/background_color=Color(0.92,0.97,0.93,1)

[preset.1]
name="Linux"
platform="Linux"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.js,*.txt"
exclude_filter="tests/*,integration/*,tools/*,web/*"
export_path="../.migration-validation/linux/mini-market.x86_64"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.2]
name="iOS"
platform="iOS"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.js,*.txt"
exclude_filter="tests/*,integration/*,tools/*,web/*"
export_path="../build/ios/MiniMarket.zip"
script_export_mode=2

[preset.2.options]
custom_template/debug=""
custom_template/release=""
architectures/arm64=true
; Godot requires a nonempty template value even for project-only export.
; This is NOT an Apple Team: CI removes it before the unsigned Xcode build.
application/app_store_team_id="0000000000"
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/targeted_device_family=0
application/bundle_identifier="app.olcas.market"
application/short_version="1.0.0"
application/version="1"
application/min_ios_version="14.0"
application/export_project_only=true
application/generate_simulator_library_if_missing=false
capabilities/push_notifications=false
