name: Unity validation and artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build after tests
        required: true
        type: choice
        options: [WebGL, Android, iOS]
        default: WebGL
      confirm_license:
        description: Confirm that UNITY_LICENSE credentials are configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ inputs.confirm_license }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/MiniMarketUnity
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts

  webgl:
    if: ${{ inputs.confirm_license && inputs.target == 'WebGL' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/MiniMarketUnity
          buildMethod: MiniMarket.Editor.MiniMarketProjectBuilder.BuildWeb
          targetPlatform: WebGL
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: mini-market-webgl
          path: Unity/MiniMarketUnity/Builds/WebGL

  android:
    if: ${{ inputs.confirm_license && inputs.target == 'Android' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/MiniMarketUnity
          buildMethod: MiniMarket.Editor.MiniMarketProjectBuilder.BuildAndroidAab
          targetPlatform: Android
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: mini-market-android-aab-unsigned
          path: Unity/MiniMarketUnity/Builds/Android/MiniMarket.aab

  ios:
    if: ${{ inputs.confirm_license && inputs.target == 'iOS' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/MiniMarketUnity
          buildMethod: MiniMarket.Editor.MiniMarketProjectBuilder.ExportIos
          targetPlatform: iOS
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: mini-market-ios-xcode
          path: Unity/MiniMarketUnity/Builds/iOS

