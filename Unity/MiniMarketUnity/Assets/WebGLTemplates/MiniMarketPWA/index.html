<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17231f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mini Market</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17231f;font-family:system-ui,sans-serif}#unity-container,#unity-canvas{width:100%;height:100%;display:block}#build-tag{position:fixed;right:8px;top:8px;z-index:40;padding:5px 8px;border-radius:7px;background:#17231fd9;color:#fff;font:600 11px system-ui;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;color:#fff;background:linear-gradient(145deg,#17231f,#2f4d3d);z-index:3}.bar{width:min(68vw,440px);height:12px;border-radius:20px;background:#0d1612;overflow:hidden}.fill{height:100%;width:0;background:#efa53e;transition:width .2s}.small{opacity:.72;font-size:14px}button{border:0;border-radius:12px;padding:14px 28px;background:#efa53e;color:#17231f;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#auth{display:none;width:min(88vw,410px);padding:24px;border-radius:20px;background:#f8f4e8;color:#17231f;box-shadow:0 24px 80px #0008;text-align:left}#auth.visible{display:grid;gap:12px}#auth h2,#auth p{margin:0}#auth label{display:grid;gap:5px;font-size:13px;font-weight:700}#auth input{box-sizing:border-box;width:100%;border:1px solid #b9b7ad;border-radius:10px;padding:12px;font:16px system-ui;background:white}#auth-actions{display:flex;gap:8px;flex-wrap:wrap}#auth-actions button{flex:1;padding:10px;background:#dce8df}#auth-actions button.active{background:#efa53e}.auth-fields{display:grid;gap:10px}#auth-error{color:#a32d24;font-weight:700;min-height:20px}#auth-success{color:#237343;font-weight:700;min-height:20px}
  </style>
</head>
<body>
  <div id="build-tag"></div>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><strong>MINI MARKET</strong><button id="start">ENTRAR AL JUEGO</button><section id="auth"><h2 id="auth-title">Bienvenido de vuelta</h2><p id="auth-copy">Tu tienda y tus empleados te esperan.</p><div id="auth-actions"><button data-mode="login" class="active">Entrar</button><button data-mode="register">Crear perfil</button><button data-mode="forgot">Recuperar</button></div><div class="auth-fields"><label class="register-only">Tu nombre<input id="auth-name" autocomplete="name" minlength="2"></label><label class="register-only">Usuario<input id="auth-username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+"></label><label id="identity-label">Correo o usuario<input id="auth-identity" autocomplete="username"></label><label class="password-only">Contraseña<input id="auth-password" type="password" minlength="10" autocomplete="current-password"></label></div><div id="auth-error"></div><div id="auth-success"></div><button id="auth-submit">Entrar al mercado</button></section><div class="bar"><div class="fill" id="fill"></div></div><div class="small" id="message">Toca para iniciar</div></div>
  <script>
    const root="Build",localHost=["localhost","127.0.0.1","::1"].includes(location.hostname),buildVersion=localHost?String(Date.now()):"__MINIMARKET_BUILD_STAMP__";document.querySelector("#build-tag").textContent=localHost?"LOCAL · "+new Date(Number(buildVersion)).toLocaleTimeString():"";const config={dataUrl:root+"/{{{ DATA_FILENAME }}}?v="+buildVersion,frameworkUrl:root+"/{{{ FRAMEWORK_FILENAME }}}?v="+buildVersion,codeUrl:root+"/{{{ CODE_FILENAME }}}?v="+buildVersion,streamingAssetsUrl:"StreamingAssets",companyName:"{{{ COMPANY_NAME }}}",productName:"{{{ PRODUCT_NAME }}}",productVersion:"{{{ PRODUCT_VERSION }}}",autoSyncPersistentDataPath:true};
    // unregister() does not stop an already active worker from answering
    // this page load, so a stale worker could still hand Unity the previous
    // catalog. Purge, then reload once so the page comes back uncontrolled.
    const cachePurge=localHost&&"serviceWorker" in navigator?Promise.all([navigator.serviceWorker.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))),caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key))))]).then(()=>{if(navigator.serviceWorker.controller&&!sessionStorage.getItem("mini-market-sw-purged")){sessionStorage.setItem("mini-market-sw-purged","1");location.reload();}}).catch(()=>{}):Promise.resolve();
    async function authenticated(){if(localHost)return true;try{const response=await fetch("/api/auth/get-session",{credentials:"include",headers:{Accept:"application/json"}});if(!response.ok)return false;const payload=await response.json();return !!(payload&&payload.user);}catch{return false;}}
    let authMode="login";const auth=document.querySelector("#auth"),authError=document.querySelector("#auth-error"),authSuccess=document.querySelector("#auth-success");
    function setAuthMode(mode){authMode=mode;authError.textContent="";authSuccess.textContent="";document.querySelectorAll("#auth-actions button").forEach(button=>button.classList.toggle("active",button.dataset.mode===mode));document.querySelectorAll(".register-only").forEach(field=>field.style.display=mode==="register"?"grid":"none");document.querySelectorAll(".password-only").forEach(field=>field.style.display=mode==="forgot"?"none":"grid");document.querySelector("#identity-label").firstChild.textContent=mode==="login"?"Correo o usuario":"Correo electrónico";document.querySelector("#auth-title").textContent=mode==="login"?"Bienvenido de vuelta":mode==="register"?"Crea tu empresa":"Recupera tu acceso";document.querySelector("#auth-copy").textContent=mode==="login"?"Tu tienda y tus empleados te esperan.":mode==="register"?"Tu progreso quedará protegido en la nube.":"Te enviaremos un enlace seguro.";document.querySelector("#auth-submit").textContent=mode==="login"?"Entrar al mercado":mode==="register"?"Crear perfil y jugar":"Enviar enlace";}
    function showAuth(){document.querySelector("#start")?.remove();auth.classList.add("visible");document.querySelector("#message").textContent="Partida privada · conexión segura";setAuthMode("login");}
    async function authRequest(path,body){const response=await fetch("/api/auth"+path,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let payload={};try{payload=await response.json();}catch{}if(!response.ok||payload.error)throw new Error(payload.message||payload.error?.message||"No se pudo completar la operación");return payload;}
    document.querySelectorAll("#auth-actions button").forEach(button=>button.addEventListener("click",()=>setAuthMode(button.dataset.mode)));
    document.querySelector("#auth-submit").addEventListener("click",async()=>{const submit=document.querySelector("#auth-submit"),identity=document.querySelector("#auth-identity").value.trim(),password=document.querySelector("#auth-password").value;authError.textContent="";authSuccess.textContent="";submit.disabled=true;try{if(authMode==="login")await authRequest(identity.includes("@")?"/sign-in/email":"/sign-in/username",identity.includes("@")?{email:identity.toLowerCase(),password}:{username:identity.toLowerCase(),password});else if(authMode==="register")await authRequest("/sign-up/email",{email:identity.toLowerCase(),password,name:document.querySelector("#auth-name").value.trim(),username:document.querySelector("#auth-username").value.trim().toLowerCase()});else{await authRequest("/request-password-reset",{email:identity.toLowerCase(),redirectTo:location.origin+"/reset-password"});authSuccess.textContent="Si el correo existe, recibirás el enlace.";return;}auth.classList.remove("visible");starting=false;await startGame();}catch(error){authError.textContent=error.message;}finally{submit.disabled=false;}});
    async function startGame(){if(starting)return;starting=true;await cachePurge;document.querySelector("#message").textContent="Comprobando sesión…";if(!await authenticated()){starting=false;showAuth();return;}document.querySelector("#start")?.remove();auth.classList.remove("visible");document.querySelector("#message").textContent="Cargando tienda…";const script=document.createElement("script");script.src=root+"/{{{ LOADER_FILENAME }}}?v="+buildVersion;script.onload=()=>createUnityInstance(document.querySelector("#unity-canvas"),config,p=>document.querySelector("#fill").style.width=(p*100)+"%").then(instance=>{window.miniMarketUnity=instance;document.querySelector("#loading").remove();window.dispatchEvent(new Event("minimarket-ready"));}).catch(e=>document.querySelector("#message").textContent=e);document.body.appendChild(script);}
    window.miniMarketLogout=async()=>{try{await fetch("/api/auth/sign-out",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:"{}"});}finally{localStorage.removeItem("mini-market-offline-player-v1");localStorage.removeItem("mini-market-recovery-v1");navigator.serviceWorker?.controller?.postMessage({type:"CLEAR_PRIVATE_CACHE"});location.assign("/");}};
    let starting=false;document.querySelector("#start").addEventListener("click",startGame);
    if(!localHost&&"serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).then(registration=>registration.update()));
  </script>
</body>
</html>
