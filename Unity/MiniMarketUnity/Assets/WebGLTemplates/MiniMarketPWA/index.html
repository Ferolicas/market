<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f5e5cc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mini Market</title>
  <style>
    html,body{position:fixed;inset:0;margin:0;padding:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#f5e5cc;font-family:system-ui,sans-serif}
    #unity-container{position:fixed;top:0;right:0;bottom:calc(0px - env(safe-area-inset-bottom));left:0;overflow:hidden;border:0;border-radius:0;background:#f5e5cc;box-shadow:none}
    #unity-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;border:0;border-radius:0;outline:0;box-shadow:none}
    #build-tag{position:fixed;right:8px;top:8px;z-index:40;padding:5px 8px;border-radius:7px;background:#17231fd9;color:#fff;font:600 11px system-ui;pointer-events:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;color:#323524;background:#f5ede5;z-index:3}
    #brand-splash{position:fixed;inset:0;z-index:4;display:grid;place-content:center;background:#17231f;color:#fff;animation:brand-away .55s cubic-bezier(.7,0,.2,1) .9s forwards;pointer-events:none}
    .dev-mark{display:grid;justify-items:center;gap:16px;letter-spacing:.27em;font-weight:800;font-size:clamp(23px,6vw,38px);animation:brand-in .7s cubic-bezier(.2,.8,.2,1) both}
    .dev-cube{position:relative;width:52px;height:52px;transform:rotate(45deg);border:4px solid #f5ede5;border-radius:9px;box-shadow:0 0 0 7px #4e5536,0 0 36px #c7d39d66}
    .dev-cube:before,.dev-cube:after{content:"";position:absolute;background:#cf8946;border-radius:2px}.dev-cube:before{left:50%;top:5px;bottom:5px;width:4px;transform:translateX(-50%)}.dev-cube:after{top:50%;left:5px;right:5px;height:4px;transform:translateY(-50%)}
    #load-card{position:relative;width:min(92vw,422px);aspect-ratio:422/208;background:url("loading-store.png") center/100% 100% no-repeat;filter:drop-shadow(0 18px 38px #3a2f2640);opacity:0;transform:translateY(8px) scale(.98);animation:card-in .45s ease 1.05s forwards}
    .kit-progress{position:absolute;left:6.8%;bottom:18.8%;width:33%;height:5.5%;border-radius:20px;background:#f5f0e9;box-shadow:inset 0 1px 2px #44382d55;overflow:hidden}.fill{height:100%;width:0;background:#667445;border-radius:inherit;transition:width .18s ease-out}
    #percent{position:absolute;left:40.5%;bottom:13.5%;width:12%;height:15%;display:grid;place-items:center;border-radius:7px;background:#918273;color:#fff;font-weight:800;font-size:14px}
    #message{width:min(88vw,422px);min-height:20px;color:#676e4a;font-size:13px;font-weight:700;opacity:0;animation:card-in .4s ease 1.12s forwards}
    #loading.auth-open #load-card,#loading.auth-open>#message{display:none}
    button{border:0;border-radius:12px;padding:14px 28px;background:#cf8946;color:#17231f;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #auth{display:none;width:min(82vw,370px);padding:24px;border-radius:20px;background:#f8f4e8;color:#17231f;box-shadow:0 24px 80px #0004;text-align:left;position:relative;z-index:5}#auth.visible{display:grid;gap:12px}#auth h2,#auth p{margin:0}#auth label{display:grid;gap:5px;font-size:13px;font-weight:700}#auth input{box-sizing:border-box;width:100%;border:1px solid #b9b7ad;border-radius:10px;padding:12px;font:16px system-ui;background:white}#auth-actions{display:flex;gap:8px;flex-wrap:wrap}#auth-actions button{flex:1;padding:10px;background:#dce8df}#auth-actions button.active{background:#cf8946}.auth-fields{display:grid;gap:10px}#auth-error{color:#a32d24;font-weight:700;min-height:20px}#auth-success{color:#237343;font-weight:700;min-height:20px}
    @keyframes brand-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}@keyframes brand-away{to{opacity:0;visibility:hidden;transform:scale(1.04)}}@keyframes card-in{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){#brand-splash{animation-duration:.01s}.dev-mark,#load-card,#message{animation-duration:.01s}}
  </style>
</head>
<body>
  <div id="build-tag"></div>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div id="brand-splash"><div class="dev-mark"><span class="dev-cube"></span><span>OLCAS DEV</span></div></div><div id="load-card"><div class="kit-progress"><div class="fill" id="fill"></div></div><div id="percent">0%</div></div><section id="auth"><h2 id="auth-title">Bienvenido de vuelta</h2><p id="auth-copy">Tu tienda y tus empleados te esperan.</p><div id="auth-actions"><button data-mode="login" class="active">Entrar</button><button data-mode="register">Crear perfil</button><button data-mode="forgot">Recuperar</button></div><div class="auth-fields"><label class="register-only">Tu nombre<input id="auth-name" autocomplete="name" minlength="2"></label><label class="register-only">Usuario<input id="auth-username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+"></label><label id="identity-label">Correo o usuario<input id="auth-identity" autocomplete="username"></label><label class="password-only">Contraseña<input id="auth-password" type="password" minlength="10" autocomplete="current-password"></label></div><div id="auth-error"></div><div id="auth-success"></div><button id="auth-submit">Entrar al mercado</button></section><div id="message">Cargando recursos guardados…</div></div>
  <script>
    const root="Build",localHost=["localhost","127.0.0.1","::1"].includes(location.hostname),buildVersion=localHost?String(Date.now()):"__MINIMARKET_BUILD_STAMP__";document.querySelector("#build-tag").textContent=localHost?"LOCAL · "+new Date(Number(buildVersion)).toLocaleTimeString():"";const config={dataUrl:root+"/{{{ DATA_FILENAME }}}?v="+buildVersion,frameworkUrl:root+"/{{{ FRAMEWORK_FILENAME }}}?v="+buildVersion,codeUrl:root+"/{{{ CODE_FILENAME }}}?v="+buildVersion,streamingAssetsUrl:"StreamingAssets",companyName:"{{{ COMPANY_NAME }}}",productName:"{{{ PRODUCT_NAME }}}",productVersion:"{{{ PRODUCT_VERSION }}}",autoSyncPersistentDataPath:true,cacheControl:url=>url.includes("Build/")?"immutable":"must-revalidate",
// A phone reports two or three device pixels for every css pixel and Unity
// draws all of them: nine times the work on a 3x screen, which is where the
// heat and the battery went. Capped at 1.5 on a phone, 2 elsewhere.
devicePixelRatio:Math.min(window.devicePixelRatio||1,/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?1.5:2)};
    // unregister() does not stop an already active worker from answering
    // this page load, so a stale worker could still hand Unity the previous
    // catalog. Purge, then reload once so the page comes back uncontrolled.
    const cachePurge=localHost&&"serviceWorker" in navigator?Promise.all([navigator.serviceWorker.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))),caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key))))]).then(()=>{if(navigator.serviceWorker.controller&&!sessionStorage.getItem("mini-market-sw-purged")){sessionStorage.setItem("mini-market-sw-purged","1");location.reload();}}).catch(()=>{}):Promise.resolve();
    const brandMinimum=new Promise(resolve=>setTimeout(resolve,1200));
    async function authenticated(){if(localHost)return true;try{const response=await fetch("/api/auth/get-session",{credentials:"include",headers:{Accept:"application/json"}});if(!response.ok)return false;const payload=await response.json();return !!(payload&&payload.user);}catch{return false;}}
    let authMode="login";const auth=document.querySelector("#auth"),authError=document.querySelector("#auth-error"),authSuccess=document.querySelector("#auth-success");
    function setAuthMode(mode){authMode=mode;authError.textContent="";authSuccess.textContent="";document.querySelectorAll("#auth-actions button").forEach(button=>button.classList.toggle("active",button.dataset.mode===mode));document.querySelectorAll(".register-only").forEach(field=>field.style.display=mode==="register"?"grid":"none");document.querySelectorAll(".password-only").forEach(field=>field.style.display=mode==="forgot"?"none":"grid");document.querySelector("#identity-label").firstChild.textContent=mode==="login"?"Correo o usuario":"Correo electrónico";document.querySelector("#auth-title").textContent=mode==="login"?"Bienvenido de vuelta":mode==="register"?"Crea tu empresa":"Recupera tu acceso";document.querySelector("#auth-copy").textContent=mode==="login"?"Tu tienda y tus empleados te esperan.":mode==="register"?"Tu progreso quedará protegido en la nube.":"Te enviaremos un enlace seguro.";document.querySelector("#auth-submit").textContent=mode==="login"?"Entrar al mercado":mode==="register"?"Crear perfil y jugar":"Enviar enlace";}
    function showAuth(){document.querySelector("#loading").classList.add("auth-open");auth.classList.add("visible");setAuthMode("login");}
    async function authRequest(path,body){const response=await fetch("/api/auth"+path,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let payload={};try{payload=await response.json();}catch{}if(!response.ok||payload.error)throw new Error(payload.message||payload.error?.message||"No se pudo completar la operación");return payload;}
    document.querySelectorAll("#auth-actions button").forEach(button=>button.addEventListener("click",()=>setAuthMode(button.dataset.mode)));
    document.querySelector("#auth-submit").addEventListener("click",async()=>{const submit=document.querySelector("#auth-submit"),identity=document.querySelector("#auth-identity").value.trim(),password=document.querySelector("#auth-password").value;authError.textContent="";authSuccess.textContent="";submit.disabled=true;try{if(authMode==="login")await authRequest(identity.includes("@")?"/sign-in/email":"/sign-in/username",identity.includes("@")?{email:identity.toLowerCase(),password}:{username:identity.toLowerCase(),password});else if(authMode==="register")await authRequest("/sign-up/email",{email:identity.toLowerCase(),password,name:document.querySelector("#auth-name").value.trim(),username:document.querySelector("#auth-username").value.trim().toLowerCase()});else{await authRequest("/request-password-reset",{email:identity.toLowerCase(),redirectTo:location.origin+"/reset-password"});authSuccess.textContent="Si el correo existe, recibirás el enlace.";return;}auth.classList.remove("visible");document.querySelector("#loading").classList.remove("auth-open");starting=false;await startGame();}catch(error){authError.textContent=error.message;}finally{submit.disabled=false;}});
    async function startGame(){if(starting)return;starting=true;await cachePurge;document.querySelector("#message").textContent="Comprobando sesión…";if(!await authenticated()){starting=false;showAuth();return;}auth.classList.remove("visible");document.querySelector("#loading").classList.remove("auth-open");document.querySelector("#message").textContent="Cargando recursos guardados…";const script=document.createElement("script");script.src=root+"/{{{ LOADER_FILENAME }}}?v="+buildVersion;script.onload=()=>createUnityInstance(document.querySelector("#unity-canvas"),config,p=>{const percent=Math.round(p*100);document.querySelector("#fill").style.width=percent+"%";document.querySelector("#percent").textContent=percent+"%";}).then(async instance=>{await brandMinimum;window.miniMarketUnity=instance;document.querySelector("#loading").remove();window.dispatchEvent(new Event("minimarket-ready"));}).catch(e=>document.querySelector("#message").textContent=String(e));script.onerror=()=>document.querySelector("#message").textContent="No se pudo cargar el motor del juego";document.body.appendChild(script);}
    window.miniMarketLogout=async()=>{try{await fetch("/api/auth/sign-out",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:"{}"});}finally{localStorage.removeItem("mini-market-offline-player-v1");localStorage.removeItem("mini-market-recovery-v1");navigator.serviceWorker?.controller?.postMessage({type:"CLEAR_PRIVATE_CACHE"});location.assign("/");}};
    let starting=false;startGame();
    if(!localHost&&"serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).then(registration=>registration.update()));
  </script>
</body>
</html>
